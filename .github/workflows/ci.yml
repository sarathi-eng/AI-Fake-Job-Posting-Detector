name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run detector tests
        run: python test_detector.py

      - name: Run API tests
        shell: bash
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          UVICORN_PID=$!
          API_READY=0
          MAX_WAIT_SECONDS=30
          for ((i=1; i<=MAX_WAIT_SECONDS; i++)); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              API_READY=1
              break
            fi
            sleep 1
          done
          if [ "$API_READY" -ne 1 ]; then
            echo "API failed to become healthy within ${MAX_WAIT_SECONDS} seconds"
            kill "$UVICORN_PID" || true
            exit 1
          fi
          python test_api.py
          kill "$UVICORN_PID"
