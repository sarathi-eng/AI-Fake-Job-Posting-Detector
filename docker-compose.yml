services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=dev
      - CORS_ALLOW_ORIGINS=*
      - CORS_ALLOW_CREDENTIALS=false

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Browser should reach the API on the host-mapped port.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
